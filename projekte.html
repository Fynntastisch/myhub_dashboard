<body>
<div id="login"><div class="card"><div class="logo" style="padding:0 0 14px">MY<b>/</b>HUB</div><h1>Willkommen zurück</h1><p class="muted">Melde dich an, um dein Dashboard zu öffnen.</p>
<input id="lm" type="email" placeholder="E-Mail" autocomplete="username"><input id="lp" type="password" placeholder="Passwort" autocomplete="current-password"><button class="btn" id="lb">Anmelden</button><div id="lerr"></div></div></div>
<div class="scrim" id="scrim"></div>
<div class="app">
<nav>
 <div class="logo"><span class="lt">MY<b>/</b>HUB</span><button class="tgl" id="tgl" title="Menü ein-/ausklappen">⇤</button></div>
 <button class="ni" id="sbtn2"><i>🔍</i><span>Suche <small style="opacity:.6">Strg+K</small></span></button>
 <div class="nlabel">Hauptmenü</div>
 <a class="ni" href="index.html"><i>◈</i><span>Übersicht</span></a>
 <a class="ni on" href="projekte.html"><i>▣</i><span>Projekte</span></a>
 <a class="ni" href="kalender.html"><i>▦</i><span>Kalender</span></a>
 <a class="ni" href="notizen.html"><i>✎</i><span>Notizen</span></a>
 <a class="ni" href="schule.html"><i>❖</i><span>Schule</span></a>
 <a class="ni" href="planer.html"><i>◷</i><span>Planer</span></a>
 <a class="ni" href="sammlung.html"><i>★</i><span>Sammlung</span></a>
 <a class="ni" href="gesundheit.html"><i>♥</i><span>Gesundheit</span></a>
 <a class="ni" href="finanzen.html"><i>€</i><span>Finanzen</span></a>
 <div class="nlabel">Weiteres</div>
 <a class="ni" href="einstellungen.html"><i>⚙</i><span>Einstellungen</span></a>
 <button class="prof" id="prof"><span class="av" id="av">?</span><div><b id="pname">Dein Name</b><small>Einstellungen</small></div></button>
</nav>
<main>
<div class="mtop"><button class="tgl" id="burger">☰</button><div class="logo"><span class="lt">MY<b>/</b>HUB</span></div><button class="tgl" id="sbtn" style="margin-left:auto" title="Suche">🔍</button></div>
<section class="page on">
<div id="pwrap">
 <div class="top"><h1>Projekte</h1></div>
 <div class="card" style="margin-bottom:18px"><div class="add" style="margin:0"><input id="pn" placeholder="Projektname"><input id="pd" placeholder="Beschreibung"><button class="btn" id="padd">Anlegen</button></div></div>
 <div class="grid" id="pl"></div>
</div>
<div id="pv" style="display:none"></div>
<div class="modal" id="tm"><div class="card mc"><h3>Aufgabe</h3>
 <input id="mt" placeholder="Titel">
 <div class="mrow"><select id="ms"><option value="0">Zu erledigen</option><option value="1">In Arbeit</option><option value="2">Erledigt</option></select><select id="mp"><option value="0">Niedrig</option><option value="1">Mittel</option><option value="2">Hoch</option></select><input id="md" type="date" style="margin:0"></div>
 <input id="ml" placeholder="Label (z. B. Schule, Privat)">
 <textarea id="mn" rows="3" placeholder="Notizen"></textarea>
 <h3>Checkliste</h3><ul id="mcl"></ul><div class="add"><input id="mci" placeholder="Punkt hinzufügen …"><button class="btn" id="mca">+</button></div>
 <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><button class="x" id="mdel">🗑 Löschen</button><button class="btn" id="mok">Fertig</button></div>
</div></div>
</section>
</main>
</div>
